<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <!-- 视口：重要参数，不可删除任何内容 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">

  <!-- iOS 全屏模式 -->
  <!-- 允许独立窗口运行「去除 Safari 地址栏和底部工具栏」 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- 状态栏透明，页面内容延伸「必须配合安全区」 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- 桌面图标下方显示名字 -->
  <meta name="apple-mobile-web-app-title" content="Qu Phone">

  <!-- Android / 标准写法 -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Android 状态栏底色，必须与 manifest 的 theme_color 一致 -->
  <meta name="theme-color" content="#f6f6f6">

  <!-- iOS 桌面图标 -->
  <link rel="apple-touch-icon" href="icon/icon_192.png">
  <!-- 浏览器标签页图标 -->
  <link rel="icon" type="image/png" href="icon/icon_192.png">
  <!-- Android 识别安装文件 -->
  <link rel="manifest" href="manifest.json">

  <title>Qu Phone</title>

  <!-- 开屏标题字体：字体已子集化 ; crossorigin 必须标注 -->
  <link rel="preload" href="fonts/%E6%A0%87%E9%A2%98.woff2?v=1.3.1" as="font" type="font/woff2" crossorigin>

  <!-- 图标库：图标数据内联；版本号锁死 -->
  <script src="https://unpkg.com/reicon@1/cdn/reicon.js"></script>

  <link rel="stylesheet" href="css/base.css?v=1.2.0">
  <link rel="stylesheet" href="css/boot.css?v=1.1.0">
  <link rel="stylesheet" href="css/home.css?v=1.1.2">
  <link rel="stylesheet" href="css/settings.css?v=1.2.0">
  <link rel="stylesheet" href="css/setting-api.css?v=1.3.0">
  <link rel="stylesheet" href="css/setting-version.css?v=1.0.0">
  <link rel="stylesheet" href="css/avatar-picker.css?v=1.1.0">
  <!-- profile.css 复用 setting-api.css 的弹窗 / 分段卡槽 / 输入框，必须排在它之后 -->
  <link rel="stylesheet" href="css/profile.css?v=1.3.1">
  <!-- profile-export.css 复用 setting-api.css 的按钮，必须排在它之后 -->
  <link rel="stylesheet" href="css/profile-export.css?v=1.0.0">
  <!-- world.css 同样复用 setting-api.css 的公共部件，必须排在它之后 -->
  <link rel="stylesheet" href="css/world.css?v=1.7.1">
  <!-- chat-register.css 同样复用 setting-api.css 的输入框 / 按钮，必须排在它之后 -->
  <link rel="stylesheet" href="css/chat/chat-register.css?v=1.1.1">
</head>
<body>

  <!-- .device-frame 包住开屏页&主屏幕；始终铺满视口。 -->
  <div class="device-frame">

    <div id="boot">
      <div class="boot-center">
        <!-- 标题与进度线共用一个容器，中心完全重合；容器宽度由 boot.js 锁死为标题实际宽度 -->
        <div class="boot-logo" id="boot-logo">
          <h1 class="boot-title" id="boot-title">Qu Phone</h1>
          <div class="boot-progress" aria-hidden="true">
            <div class="boot-progress-fill" id="boot-progress-fill"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="app">
      <!-- 提示横幅：绝对定位悬浮层。必须挂在 #app 下，放进 #home-page 会跟着主屏一起被藏掉 -->
      <div class="dev-banner" id="dev-banner" role="status" aria-live="polite"></div>

      <!-- 主屏幕骨架必须静态写在此处，renderHome() 只填内容不建容器 -->
      <div id="home-page">
        <div class="status-bar"></div>
        <div class="desktop-viewport">
          <div class="desktop-page" id="desktop-page"></div>
        </div>
        <div class="dock-area">
          <div class="dock-glass" id="dock-glass"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- api-base.js 必须排在 app-auth.js 之前：后者一加载就用 apiUrl() 发请求 -->
  <script src="js/api-base.js?v=1.0.0"></script>
  <!-- app-auth.js 必须排在所有模块最前：它一加载就发 /api/auth/me，
       boot.js 的 startBoot() 要等它确认过登录态（方案 §6.2） -->
  <script src="auth/app-auth.js?v=1.1.0"></script>
  <!-- store 必须排在用它的模块前面：它一加载就开始装载 IndexedDB，
       其余模块的读写都要等它的 storeReady() -->
  <script src="js/store.js?v=2.0.0"></script>
  <script src="js/home.js?v=1.3.0"></script>
  <!-- setting-version.js 必须排在 settings.js 之前：SETTINGS_GROUPS 的「版本」行解析期就要读 VERSION_NO -->
  <script src="js/setting-version.js?v=1.0.0"></script>
  <script src="js/settings.js?v=1.7.0"></script>
  <script src="js/setting-api.js?v=1.3.0"></script>
  <!-- avatar-picker.js 必须排在 profile.js 之前：角色编辑页点头像时要调它的单例 -->
  <script src="js/avatar-picker.js?v=1.1.0"></script>
  <!-- profile.js 依赖 store.js / home.js ，以及 setting-api.js -->
  <script src="js/profile.js?v=1.4.0"></script>
  <!-- profile-export.js 必须排在 profile.js 之后：出图要用它的 pfNameOf() / pfTypeLabel()；
       导入角色卡的解析（readProfileCard）也在它里面 -->
  <script src="js/profile-export.js?v=1.1.0"></script>
  <!-- world.js 依赖 store.js / home.js、setting-api.js ，
       以及 profile.js 的 PF_KEY / pfNormalizeList()「绑定角色时只读同一份角色数据」-->
  <script src="js/world.js?v=1.2.2"></script>
  <script src="js/chat/chat-register.js?v=1.1.1"></script>
  <script src="js/boot.js?v=1.2.0"></script>

  <script src="js/sw-register.js?v=1.0.0"></script>

</body>
</html>
